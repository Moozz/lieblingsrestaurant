<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lieblingsrestaurant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
  <h1>🍽 lieblingsrestaurant</h1>
  <p class="sub">spin the wheel, let fate decide.</p>

  <div class="status-bar">
    <div>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">loading...</span>
    </div>
    <button class="btn-settings" onclick="openSettings()">⚙ settings</button>
  </div>

  <div class="location-bar">
    <button class="btn-location" onclick="openLocations()"><span id="currentLocationLabel">…</span> <span style="opacity:.5">▾</span></button>
  </div>

  <div class="spin-split">
    <div class="spin-left">
      <div class="spin-zone">
        <span class="result-emoji" id="resultEmoji">🎲</span>
        <div class="result-name" id="resultName">loading...</div>
        <div class="result-meta" id="resultMeta"></div>
        <div class="result-note" id="resultNote"></div>
        <button class="btn-secondary" id="viewRecipeBtn" style="display:none; margin-top:10px; width:100%;" onclick="openRecipeDetail(lastSpinIndex)">view recipe →</button>
      </div>
      <button class="btn-spin" id="spinBtn" onclick="spin()" disabled>spin</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="section-head">
    <span class="section-title"><span id="sectionTypeLabel">restaurants</span> <span class="count-badge" id="countBadge">0</span></span>
    <button class="btn-add" onclick="handleAddClick()"><span id="addBtnLabel">+ add</span></button>
  </div>
  <div class="list" id="list"></div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-bg" id="modal" style="display:none">
  <div class="modal">
    <h2 id="modalTitle">add a restaurant</h2>
    <div class="field"><label>name</label><input id="fName" placeholder="e.g. Som Tam Nua"/></div>
    <div class="field"><label>tags (comma separated)</label><input id="fCuisine" placeholder="e.g. thai, sushi, cheap, date night"/></div>
    <div class="field"><label>emoji (optional)</label><input id="fEmoji" placeholder="🍜" maxlength="8" style="width:70px"/></div>
    <div class="field"><label>note (optional)</label><textarea id="fNote" placeholder="must try the crispy pork..."></textarea></div>
    <div class="error-msg" id="saveError"></div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeModal()">cancel</button>
      <button class="btn-primary" id="saveBtn" onclick="saveRestaurant()">save</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-bg" id="settingsModal" style="display:none">
  <div class="modal">
    <h2>settings</h2>
    <div class="field">
      <label>github personal access token</label>
      <input type="password" id="sToken" placeholder="github_pat_..."/>
      <p class="hint">
        Generate at <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a>
        (classic) with <strong>repo</strong> scope. Stored only in this browser's localStorage.
      </p>
    </div>
    <div class="error-msg" id="settingsError"></div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeSettings()">cancel</button>
      <button class="btn-primary" id="settingsSaveBtn" onclick="saveSettings()">save &amp; connect</button>
    </div>
  </div>
</div>

<!-- Locations Modal -->
<div class="modal-bg" id="locationsModal" style="display:none">
  <div class="modal">
    <h2>locations</h2>
    <div class="list" id="locationsList" style="margin-bottom:14px;"></div>
    <div class="field">
      <label>add new location</label>
      <input id="fNewLocation" placeholder="e.g. Chiang Mai"/>
      <div class="loc-type-choice">
        <label><input type="radio" name="newLocType" value="restaurant" checked/> restaurants</label>
        <label><input type="radio" name="newLocType" value="recipe"/> recipes</label>
      </div>
      <button class="btn-add" onclick="addLocation()">+ add</button>
    </div>
    <div class="error-msg" id="locationsError"></div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeLocations()">close</button>
    </div>
  </div>
</div>

<!-- Recipe Detail Overlay -->
<div class="overlay" id="recipeDetailOverlay" style="display:none">
  <div class="overlay-header">
    <button class="btn-icon" onclick="closeRecipeDetail()">←</button>
    <span class="overlay-title">recipe</span>
    <div class="overlay-actions">
      <button class="btn-icon" title="edit" onclick="editFromDetail()">✎</button>
      <button class="btn-icon" title="delete" onclick="deleteFromDetail()">✕</button>
    </div>
  </div>
  <div class="overlay-body">
    <div class="recipe-header">
      <span class="recipe-emoji" id="rdEmoji">🍳</span>
      <h2 id="rdName"></h2>
      <div class="rest-tags" id="rdTags"></div>
      <div class="recipe-meta" id="rdMeta"></div>
      <p class="result-note" id="rdNote"></p>
    </div>
    <div class="recipe-block">
      <div class="section-title">ingredients</div>
      <div id="rdIngredients"></div>
    </div>
    <div class="recipe-block">
      <div class="section-title">instructions</div>
      <div id="rdSections"></div>
    </div>
  </div>
</div>

<!-- Recipe Add / Edit Overlay -->
<div class="overlay" id="recipeFormOverlay" style="display:none">
  <div class="overlay-header">
    <button class="btn-icon" onclick="closeRecipeForm()">←</button>
    <span class="overlay-title" id="recipeFormTitle">add a recipe</span>
    <button class="btn-primary" id="recipeSaveBtn" style="flex:none; padding:6px 16px;" onclick="saveRecipe()">save</button>
  </div>
  <div class="overlay-body">
    <div class="field">
      <label>paste recipe JSON (optional — fills the form below)</label>
      <textarea id="rfPaste" placeholder='{"name": "...", "ingredients": [...], "sections": [...] }' style="min-height:70px;"></textarea>
      <button class="btn-secondary" style="margin-top:6px; width:100%;" onclick="parsePastedRecipe()">parse &amp; fill form</button>
      <div class="error-msg" id="rfPasteError"></div>
    </div>

    <div class="field"><label>name</label><input id="rfName" placeholder="e.g. Pad Kra Pao"/></div>
    <div class="field"><label>tags (comma separated)</label><input id="rfTags" placeholder="thai, spicy, quick"/></div>
    <div class="field"><label>emoji</label><input id="rfEmoji" maxlength="8" style="width:70px" placeholder="🌶️"/></div>
    <div class="field"><label>note (optional)</label><textarea id="rfNote"></textarea></div>
    <div class="field" style="display:flex; gap:10px;">
      <div style="flex:1"><label>servings</label><input id="rfServings" type="number" min="1"/></div>
      <div style="flex:1"><label>prep (min)</label><input id="rfPrepTime" type="number" min="0"/></div>
      <div style="flex:1"><label>cook (min)</label><input id="rfCookTime" type="number" min="0"/></div>
    </div>

    <div class="field">
      <label>ingredients</label>
      <div id="rfIngredientsList"></div>
      <button class="btn-add" onclick="addIngredientRow()">+ add ingredient</button>
    </div>

    <div class="field">
      <label>instructions</label>
      <div id="rfSectionsList"></div>
      <button class="btn-add" onclick="addSectionBlock()">+ add section</button>
    </div>

    <div class="error-msg" id="recipeFormError"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
